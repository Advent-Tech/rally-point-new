workflows:
  flutter-app:
    name: Flutter App Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Run tests
        script: |
          flutter test

      - name: Build Android APK
        script: |
          flutter build apk --release

      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/**/outputs/**/*.apk
      - build/ios/**/*.app
