name: light_point
description: "Light Point - Field Ministry Management App"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9

  # State Management - BLoC
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # Network & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Maps & Location - Native Mapbox SDK for best performance
  mapbox_maps_flutter: ^2.4.0
  geolocator: ^11.0.0

  # UI Components
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  pull_to_refresh: ^2.0.0
  fl_chart: ^0.69.0

  # Forms & Validation
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.0.0

  # Utilities
  intl: any
  uuid: ^4.3.3
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.5
  path_provider: ^2.1.2

  # Audio (for walkie-talkie)
  just_audio: ^0.9.36
  record: ^5.2.0
  audioplayers: ^6.0.0
  flutter_sound: ^9.2.13

  # Permissions
  permission_handler: ^11.3.0

  # Image & Signature Capture
  image_picker: ^1.0.7
  signature: ^5.4.1

  # Payments (cash only)

  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.0

  # Supabase (for direct storage uploads)
  supabase_flutter: ^2.3.0

  # WebView for admin dashboard
  webview_flutter: ^4.10.0

  # Responsive Design
  responsive_framework: ^1.1.1
  flutter_screenutil: ^5.9.0
  showcaseview: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.3.8
  flutter_launcher_icons: ^0.13.1

# Flutter Native Splash configuration
flutter_native_splash:
  color: "#ffffff"
  image: assets/vertcal-logo.png
  color_dark: "#1a1a2e"
  image_dark: assets/vertcal-logo.png
  fullscreen: false
  android_12:
    color: "#ffffff"
    icon_background_color: "#ffffff"
    image: assets/vertcal-logo.png
    color_dark: "#1a1a2e"
    icon_background_color_dark: "#1a1a2e"
    image_dark: assets/vertcal-logo.png

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/adaptive-icon.png"
  image_path_ios: "assets/splash.jpeg"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/adaptive-icon.png"

dependency_overrides:
  record_linux: ^1.0.0
  record_windows: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/books/
    - assets/images/
    - assets/icons/

  # Custom fonts - uncomment when font files are added
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
