name: rally_admin
description: Rally Point Admin Panel for managing users, territories, surveys, and donations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Network
  dio: ^5.8.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI Components
  data_table_2: ^2.5.17
  fl_chart: ^0.70.2
  intl: ^0.20.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Utils
  json_annotation: ^4.9.0
  uuid: ^4.5.1

  # Searchable dropdowns
  dropdown_search: ^5.0.6

  # File picker
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
