workflows:
  ios-workflow:
    name: Rally Point iOS
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - mapbox_tokens
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Set up Mapbox
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          # Recreate iOS project structure
          flutter create --platforms ios .
          
          # Manually create Podfile to bypass CDN issues and set platform
          cat <<EOF > ios/Podfile
          # Load Flutter helper methods
          flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__)) if respond_to?(:flutter_install_all_ios_pods)
          
          # Fallback if the helper is not available (manual definition)
          if !respond_to?(:flutter_install_all_ios_pods)
            def flutter_install_all_ios_pods(path)
              # Minimal fallback for plugin registration
            end
          end

          platform :ios, '13.0'
          source 'https://github.com/CocoaPods/Specs.git'
          
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            
            # The standard Flutter pod inclusion
            # We need to ensure the helper is loaded before this
            if respond_to?(:flutter_install_all_ios_pods)
              flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            end
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target) if respond_to?(:flutter_additional_ios_build_settings)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end
            end
          end
          EOF

          # Ensure the Podfile includes the actual Flutter helper script path
          # This is critical because 'flutter create' might not have linked it correctly in the custom Podfile
          sed -i '' "1s|^|require File.expand_path(File.join('..', '..', '..', 'packages', 'flutter_tools', 'bin', 'podhelper'), \`flutter config --machine \| grep -o '\"flutterRoot\": \"[^\"]*\"' \| cut -d'\"' -f4\`)\n|" ios/Podfile || true

          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          # Build the IPA
          flutter build ios --release --no-codesign
    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

  android-workflow:
    name: Rally Point Android
    instance_type: linux
    max_build_duration: 30
    environment:
      groups:
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - ui_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
