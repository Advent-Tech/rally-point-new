workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2  # Use Apple silicon for faster builds
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - "iOS build"
      vars:
        PROJECT_DIR: "ui_flutter"
        BUNDLE_ID: "com.lightpoint.lightpointapp"
        APPLE_APP_ID: "6761075004"
        API_BASE_URL: "https://backend.lightsquads.com"
    scripts:
      - name: Set up Mapbox
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          flutter pub get
      - name: Update CocoaPods specs
        script: |
          cd $PROJECT_DIR/ios
          pod repo update
          pod install --repo-update
      - name: Set up keychain
        script: keychain initialize
      - name: Prepare App Store Connect API key
        script: |
          set -e
          python3 - <<'PY'
          import os, base64, sys
          k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '') or ''
          kb64 = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY_BASE64', '') or ''
          if kb64.strip():
            k = base64.b64decode(kb64).decode('utf-8')
          k = k.replace('\\n', '\n').strip() + '\n'
          sys.stdout.write(k)
          PY
          
          python3 - <<'PY' > "$HOME/AuthKey.p8"
          import os, base64, sys
          k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '') or ''
          kb64 = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY_BASE64', '') or ''
          if kb64.strip():
            k = base64.b64decode(kb64).decode('utf-8')
          k = k.replace('\\n', '\n').strip() + '\n'
          sys.stdout.write(k)
          PY

          if ! grep -q "BEGIN PRIVATE KEY" "$HOME/AuthKey.p8"; then
            echo "APP_STORE_CONNECT_PRIVATE_KEY is not a valid .p8/PEM key (missing BEGIN PRIVATE KEY header)" >&2
            exit 1
          fi

          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$HOME/AuthKey.p8")"
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Configure Xcode code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd $PROJECT_DIR
          echo "Raw CI vars: CM_BUILD_ID=${CM_BUILD_ID:-<unset>} CM_BUILD_NUMBER=${CM_BUILD_NUMBER:-<unset>}"
          BUILD_NUMBER=""
          for CANDIDATE in "${CM_BUILD_ID:-}" "${CM_BUILD_NUMBER:-}"; do
            if [[ "$CANDIDATE" =~ ^[0-9]+$ ]]; then
              BUILD_NUMBER="$CANDIDATE"
              break
            fi
          done
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$(date -u +%s)"
            echo "No numeric CI build number found; using UTC timestamp fallback: $BUILD_NUMBER"
          fi
          echo "Using monotonic iOS build-number=$BUILD_NUMBER"
          echo "$BUILD_NUMBER" > /tmp/expected_ios_build_number.txt
          flutter build ipa --release -v \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=$HOME/export_options.plist

      - name: Debug - list IPA outputs
        script: |
          set -e
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "BUNDLE_ID=$BUNDLE_ID"
          echo "APPLE_APP_ID=$APPLE_APP_ID"
          echo "CM_BUILD_NUMBER=$CM_BUILD_NUMBER"
          echo "Expected iOS build number file:"
          cat /tmp/expected_ios_build_number.txt || true
          ls -la "$CM_BUILD_DIR/$PROJECT_DIR/build/ios" || true
          ls -la "$CM_BUILD_DIR/$PROJECT_DIR/build/ios/ipa" || true
          echo "Generated export_options.plist:"
          cat "$HOME/export_options.plist" || true

      - name: Verify IPA identity before upload
        script: |
          set -euo pipefail
          IPA_DIR="$CM_BUILD_DIR/$PROJECT_DIR/build/ios/ipa"
          IPA_PATH="$(find "$IPA_DIR" -maxdepth 2 -name "*.ipa" -print -quit || true)"
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA found under $IPA_DIR" >&2
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH"
          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check
          unzip -q "$IPA_PATH" -d /tmp/ipa_check
          APP_PATH="$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" -print -quit || true)"
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app found inside IPA payload" >&2
            exit 1
          fi

          IPA_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          IPA_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          IPA_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          EXPECTED_BUILD="$(cat /tmp/expected_ios_build_number.txt 2>/dev/null || true)"
          echo "IPA CFBundleIdentifier=$IPA_BUNDLE_ID"
          echo "IPA CFBundleShortVersionString=$IPA_VERSION"
          echo "IPA CFBundleVersion=$IPA_BUILD"
          echo "Expected CFBundleVersion=$EXPECTED_BUILD"

          if [ "$IPA_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "Bundle ID mismatch: expected $BUNDLE_ID, got $IPA_BUNDLE_ID" >&2
            exit 1
          fi
          if ! [[ "$IPA_BUILD" =~ ^[0-9]+$ ]]; then
            echo "Invalid CFBundleVersion=$IPA_BUILD (must be numeric/incrementing for TestFlight)." >&2
            exit 1
          fi
          if [ -n "$EXPECTED_BUILD" ] && [ "$IPA_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "CFBundleVersion mismatch: expected $EXPECTED_BUILD, got $IPA_BUILD" >&2
            exit 1
          fi

      - name: Debug App Store Connect app visibility
        script: |
          set -euo pipefail
          echo "Listing accessible apps from this API key context..."
          app-store-connect apps list || true
          echo "Filtering apps list by expected bundle id: $BUNDLE_ID"
          app-store-connect apps list | grep -i "$BUNDLE_ID" || true

    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - streams.app.2030@gmail.com

  ios-firebase:
    name: iOS Firebase Distribution
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - "iOS build"
      vars:
        PROJECT_DIR: "ui_flutter"
        BUNDLE_ID: "com.lightpoint.lightpointapp"
        API_BASE_URL: "https://backend.lightsquads.com"
        FIREBASE_TESTER_GROUPS: "internal-testers"
    scripts:
      - name: Set up Mapbox
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          flutter pub get
      - name: Update CocoaPods specs
        script: |
          cd $PROJECT_DIR/ios
          pod repo update
          pod install --repo-update
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch Ad Hoc signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Configure Xcode code signing
        script: xcode-project use-profiles
      - name: Build Ad Hoc IPA
        script: |
          cd $PROJECT_DIR
          BUILD_NUMBER=""
          for CANDIDATE in "${CM_BUILD_ID:-}" "${CM_BUILD_NUMBER:-}"; do
            if [[ "$CANDIDATE" =~ ^[0-9]+$ ]]; then
              BUILD_NUMBER="$CANDIDATE"
              break
            fi
          done
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$(date -u +%s)"
          fi
          echo "Using iOS build-number=$BUILD_NUMBER"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-method ad-hoc
      - name: Upload IPA to Firebase App Distribution
        script: |
          set -euo pipefail
          if [ -z "${FIREBASE_APP_ID_IOS:-}" ]; then
            echo "FIREBASE_APP_ID_IOS is not set" >&2
            exit 1
          fi
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_TOKEN is not set" >&2
            exit 1
          fi
          IPA_PATH="$(find "$CM_BUILD_DIR/$PROJECT_DIR/build/ios/ipa" -maxdepth 2 -name "*.ipa" -print -quit || true)"
          if [ -z "${IPA_PATH:-}" ]; then
            echo "No IPA found for Firebase upload" >&2
            exit 1
          fi
          npm install -g firebase-tools
          firebase appdistribution:distribute "$IPA_PATH" \
            --app "$FIREBASE_APP_ID_IOS" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Codemagic iOS build ${CM_BUILD_ID:-unknown}" \
            --token "$FIREBASE_TOKEN"
    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - streams.app.2030@gmail.com

  android-workflow:
    name: Rally Point Android
    instance_type: linux
    max_build_duration: 30
    environment:
      groups:
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - ui_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
