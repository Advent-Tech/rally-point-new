workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Move to Flutter project
        script: |
          cd ui_flutter

      - name: Get Flutter packages
        script: |
          cd ui_flutter
          flutter pub get

      - name: Build iOS (no signing)
        script: |
          cd ui_flutter
          flutter build ios --release --no-codesign

    artifacts:
      - ui_flutter/build/ios/iphoneos/*.app
