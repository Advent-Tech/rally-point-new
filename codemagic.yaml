workflows:
  ios-workflow:
    name: Rally Point iOS
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - mapbox_tokens
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Set up Mapbox
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          # Recreate iOS project structure
          flutter create --platforms ios .
          
          # Manually create Podfile with the correct helper path
          cat <<EOF > ios/Podfile
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), `flutter config --machine | grep -o '\"flutterRoot\": \"[^\"]*\"' | cut -d'\"' -f4`)

          platform :ios, '13.0'
          # Use GitHub master repo instead of CDN to bypass connection issues
          source 'https://github.com/CocoaPods/Specs.git'
          
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end
            end
          end
          EOF

          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
          # Build the IPA
          flutter build ios --release --no-codesign
    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

  android-workflow:
    name: Rally Point Android
    instance_type: linux
    max_build_duration: 30
    environment:
      groups:
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - ui_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
