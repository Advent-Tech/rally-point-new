workflows:
  ios-release:
    name: iOS Release Build
    instance_type: mac_mini_m2  # Use Apple silicon for faster builds
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - "iOS build"
      vars:
        PROJECT_DIR: "ui_flutter"
        BUNDLE_ID: "com.rallypoint.rallypointapp"
    scripts:
      - name: Set up Mapbox
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Install dependencies
        script: |
          cd $PROJECT_DIR
          flutter pub get
      - name: Update CocoaPods specs
        script: |
          cd $PROJECT_DIR/ios
          pod repo update
          pod install --repo-update
      - name: Set up keychain
        script: keychain initialize
      - name: Prepare App Store Connect API key
        script: |
          set -e
          python3 - <<'PY'
          import os, base64, sys
          k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '') or ''
          kb64 = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY_BASE64', '') or ''
          if kb64.strip():
            k = base64.b64decode(kb64).decode('utf-8')
          k = k.replace('\\n', '\n').strip() + '\n'
          sys.stdout.write(k)
          PY
          
          python3 - <<'PY' > "$HOME/AuthKey.p8"
          import os, base64, sys
          k = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY', '') or ''
          kb64 = os.environ.get('APP_STORE_CONNECT_PRIVATE_KEY_BASE64', '') or ''
          if kb64.strip():
            k = base64.b64decode(kb64).decode('utf-8')
          k = k.replace('\\n', '\n').strip() + '\n'
          sys.stdout.write(k)
          PY

          if ! grep -q "BEGIN PRIVATE KEY" "$HOME/AuthKey.p8"; then
            echo "APP_STORE_CONNECT_PRIVATE_KEY is not a valid .p8/PEM key (missing BEGIN PRIVATE KEY header)" >&2
            exit 1
          fi

          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat "$HOME/AuthKey.p8")"
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Configure Xcode code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd $PROJECT_DIR
          flutter build ipa --release -v \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com

  android-workflow:
    name: Rally Point Android
    instance_type: linux
    max_build_duration: 30
    environment:
      groups:
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - ui_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
