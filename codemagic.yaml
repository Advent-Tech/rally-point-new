workflows:
  flutter-ios-workflow:
    name: Rally Point iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - mapbox_tokens
        - firebase_credentials
      vars:
        XCODE_WORKSPACE: "ui_flutter/ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        FLUTTER_PROJECT_PATH: "ui_flutter"
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up Mapbox Download Token
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Get Flutter packages
        script: |
          cd $FLUTTER_PROJECT_PATH && flutter pub get
      - name: Install CocoaPods
        script: |
          cd $FLUTTER_PROJECT_PATH/ios && pod install
      - name: Flutter build iOS
        script: |
          cd $FLUTTER_PROJECT_PATH && flutter build ios --release --no-codesign
    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

  flutter-android-workflow:
    name: Rally Point Android Build
    max_build_duration: 30
    instance_type: linux
    environment:
      groups:
        - firebase_credentials
      vars:
        FLUTTER_PROJECT_PATH: "ui_flutter"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd $FLUTTER_PROJECT_PATH && flutter pub get
      - name: Build Android App Bundle
        script: |
          cd $FLUTTER_PROJECT_PATH && flutter build appbundle --release
    artifacts:
      - ui_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
