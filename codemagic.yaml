workflows:
  ios-workflow:
    name: Rally Point iOS
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups:
        - mapbox_tokens
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Set up Mapbox
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          flutter pub get
          
          # Dynamically fix Podfile helper path for CI environment
          FLUTTER_SDK_PATH=$(flutter config --machine | grep -o '"flutterRoot": "[^"]*"' | cut -d'"' -f4)
          sed -i '' "s|require File.expand_path(File.join.*|require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), '$FLUTTER_SDK_PATH')|" ios/Podfile

          cd ios
          pod install --repo-update
          cd ..
          # Build the IPA
          flutter build ios --release --no-codesign
    artifacts:
      - ui_flutter/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your-email@example.com

  android-workflow:
    name: Rally Point Android
    instance_type: linux
    max_build_duration: 30
    environment:
      groups:
        - firebase_credentials
      vars:
        PROJECT_DIR: "ui_flutter"
    scripts:
      - name: Flutter build
        script: |
          cd $PROJECT_DIR
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - ui_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
